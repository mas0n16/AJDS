<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home — The Alexander Denaro Salon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2E2013;
    --paper:#D4D5D8;
    --line:#2E2013;
    --muted:#6E543A;
    --panel:#DFE0E3;
    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --display: var(--serif);
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
  }

  /* ---------- LOAD-IN ANIMATION ---------- */
  @keyframes fadeDown{ from{ opacity:0; transform:translateY(-10px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(16px); } to{ opacity:1; transform:translateY(0); } }

  header{ animation:fadeDown 0.6s ease both; }
  .hero-picture{ animation:fadeUp 0.7s ease 0.1s both; }
  .get-to-know{ animation:fadeUp 0.7s ease 0.25s both; }
  .shortcuts .shortcut-btn{ animation:fadeUp 0.6s ease both; }
  .shortcuts .shortcut-btn:nth-child(1){ animation-delay:0.35s; }
  .shortcuts .shortcut-btn:nth-child(2){ animation-delay:0.45s; }
  .shortcuts .shortcut-btn:nth-child(3){ animation-delay:0.55s; }
  .shortcuts .shortcut-btn:nth-child(4){ animation-delay:0.65s; }

  .page-head{ animation:fadeUp 0.7s ease both; }

  .stylist-grid .stylist-card{ animation:fadeUp 0.6s ease both; }
  .stylist-grid .stylist-card:nth-child(1){ animation-delay:0.12s; }
  .stylist-grid .stylist-card:nth-child(2){ animation-delay:0.2s; }
  .stylist-grid .stylist-card:nth-child(3){ animation-delay:0.28s; }
  .stylist-grid .stylist-card:nth-child(4){ animation-delay:0.36s; }
  .stylist-grid .stylist-card:nth-child(5){ animation-delay:0.44s; }
  .stylist-grid .stylist-card:nth-child(6){ animation-delay:0.52s; }

  .services-index li{ animation:fadeUp 0.55s ease both; }
  .services-index li:nth-child(1){ animation-delay:0.1s; }
  .services-index li:nth-child(2){ animation-delay:0.18s; }
  .services-index li:nth-child(3){ animation-delay:0.26s; }
  .services-index li:nth-child(4){ animation-delay:0.34s; }
  .services-index li:nth-child(5){ animation-delay:0.42s; }

  .book-panel, .location-panel, .contact-panel, .about-panel{ animation:fadeUp 0.7s ease 0.12s both; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--serif);
    font-size:18px;
    font-weight:400;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; text-decoration:none; }
  a:focus-visible, button:focus-visible{ outline:2px solid var(--ink); outline-offset:3px; }
  img,svg{ display:block; max-width:100%; }
  .wrap{ max-width:1100px; margin:0 auto; padding:0 32px; }

  :root{ --header-h:96px; }
  header{
    position:fixed; top:0; left:0; right:0; z-index:50; height:var(--header-h);
    padding:0 32px; display:flex; align-items:center; justify-content:space-between;
    background:rgba(212,213,216,0.94);
    border-bottom:1px solid rgba(59,42,32,0.12);
  }
  .header-side{ display:flex; align-items:center; gap:28px; }
  .header-side.left{ font-size:15px; letter-spacing:0.04em; text-transform:uppercase; }
  .header-wordmark{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    max-width:70vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    font-family:var(--display); font-weight:500;
    font-size:clamp(14px, 2.9vw, 32px); letter-spacing:0.1em; text-transform:uppercase;
  }
  nav ul{ list-style:none; display:flex; gap:30px; margin:0; padding:0; font-size:15px; letter-spacing:0.04em; text-transform:uppercase; }
  nav a{ position:relative; padding-bottom:3px; }
  nav a.active{ color:var(--ink); border-bottom:1px solid var(--ink); }
  .menu-toggle{ display:none; background:none; border:none; cursor:pointer; font-family:var(--serif); font-size:15px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink); padding:6px; }

  main{ padding-top:var(--header-h); padding-bottom:110px; padding-left:40px; padding-right:40px; min-height:70vh; }

  /* ---------- ONE-SCREEN HOME LAYOUT (no scroll) ---------- */
  body.fit-screen{ height:100vh; overflow:hidden; }
  body.fit-screen main{
    padding-top:var(--header-h); padding-bottom:0; padding-left:40px; padding-right:40px;
    height:100vh; display:flex; align-items:flex-start; justify-content:center;
    overflow:hidden;
  }

  /* ---------- LANDING HERO ---------- */
  .hero{
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    text-align:center; padding:clamp(10px, 2.4vh, 28px) 0 clamp(16px, 3.5vh, 36px);
    width:100%; height:100%;
  }
  .hero-picture{
    width:auto; height:clamp(150px, 36vh, 420px); aspect-ratio:4/3; background:var(--panel);
    border:1px solid rgba(59,42,32,0.18); display:flex; align-items:center; justify-content:center;
    margin:auto; overflow:hidden;
  }
  .hero-picture span{ font-size:14px; color:var(--muted); letter-spacing:0.04em; text-transform:uppercase; }
  .hero-picture img{ width:100%; height:100%; object-fit:cover; }
  .get-to-know{ font-size:clamp(22px, 3vw, 34px); color:var(--muted); text-transform:uppercase; letter-spacing:0.14em; margin:clamp(10px, 2vh, 24px) 0 clamp(12px, 2.6vh, 28px); }
  .shortcuts{ display:flex; flex-wrap:nowrap; justify-content:center; gap:0; border-top:1px solid rgba(59,42,32,0.18); width:100%; max-width:960px; margin:0 auto; }
  .shortcut-btn{
    padding:clamp(16px, 3vh, 32px) 12px; font-size:clamp(14px, 1.9vw, 21px); letter-spacing:0.06em; text-transform:uppercase; font-weight:500;
    border-bottom:1px solid rgba(59,42,32,0.18); flex:1 1 0; min-width:0; text-align:center; white-space:nowrap;
  }
  .shortcut-btn:hover{ background:var(--panel); }

  /* ---------- SIMPLE PAGE HEADER ---------- */
  .page-head{ text-align:center; padding:0 0 64px; }
  .page-head h1{
    font-family:var(--display); font-weight:400; letter-spacing:0.02em;
    font-size:clamp(24px, 3.4vw, 34px); margin:0 0 14px; text-transform:uppercase;
  }
  .page-head p{ color:var(--muted); max-width:52ch; margin:0 auto; font-size:16px; }

  /* ---------- STYLISTS ---------- */
  /* ---------- STYLIST BIO SECTIONS (scroll reveal) ---------- */
  .reveal{ opacity:0; transform:translateX(-56px); transition:opacity 0.8s ease, transform 0.8s ease; }
  .reveal.right{ transform:translateX(56px); }
  .reveal.in-view{ opacity:1; transform:translateX(0); }

  .stylist-block{
    display:flex; align-items:center; gap:64px;
    padding:80px 0; max-width:1020px; margin:0 auto;
    border-top:1px solid rgba(59,42,32,0.15);
  }
  .stylist-block:first-of-type{ border-top:none; padding-top:20px; }
  .stylist-block.reverse{ flex-direction:row-reverse; }
  .stylist-photo-lg{
    flex:0 0 auto; width:min(340px, 40vw); aspect-ratio:4/5; background:var(--panel);
    border:1px solid rgba(59,42,32,0.18); display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .stylist-photo-lg span{ font-size:14px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; }
  .stylist-photo-lg img{ width:100%; height:100%; object-fit:cover; }
  .stylist-bio{ flex:1 1 auto; text-align:left; }
  .stylist-bio-name{ font-family:var(--display); font-size:28px; font-weight:400; margin:0 0 6px; }
  .stylist-bio-role{ font-size:14px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; margin:0 0 20px; }
  .stylist-bio-text{ font-size:18px; color:var(--ink); max-width:44ch; }

  .stylist-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:48px 32px; max-width:940px; margin:0 auto; }
  .stylist-card{ text-align:center; }
  .stylist-photo{
    aspect-ratio:1/1; background:var(--panel); border:1px solid rgba(59,42,32,0.18);
    display:flex; align-items:center; justify-content:center; margin:0 0 16px;
  }
  .stylist-photo span{ font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; }
  .stylist-name{ font-size:18px; margin:0 0 4px; }
  .stylist-role{ font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; }

  /* ---------- SERVICES INDEX ---------- */
  .services-index{ list-style:none; margin:0 auto; padding:0; max-width:720px; }
  .services-index li{
    display:grid; grid-template-columns:1fr auto; gap:24px; align-items:baseline;
    padding:22px 0; border-top:1px solid rgba(59,42,32,0.18);
  }
  .services-index li:last-child{ border-bottom:1px solid rgba(59,42,32,0.18); }
  .service-name{ font-size:17px; letter-spacing:0.02em; text-transform:uppercase; }
  .service-desc{ color:var(--muted); font-size:15px; margin-top:4px; }
  .service-note{ font-size:15px; color:var(--muted); white-space:nowrap; text-transform:uppercase; letter-spacing:0.04em; }

  /* ---------- BOOK ---------- */
  .book-panel{ max-width:520px; margin:0 auto; text-align:center; border:1px solid rgba(59,42,32,0.18); padding:52px 40px; }
  .book-panel p{ color:var(--muted); margin:0 0 26px; font-size:16px; }
  .btn{
    display:inline-block; padding:14px 30px; background:var(--ink); color:var(--paper);
    font-size:14px; letter-spacing:0.06em; text-transform:uppercase; font-weight:500; border:1px solid var(--ink);
    transition:background 0.2s ease, color 0.2s ease;
  }
  .btn:hover{ background:transparent; color:var(--ink); }

  /* ---------- LOCATION ---------- */
  .location-panel{ max-width:520px; margin:0 auto; text-align:center; }
  .map-placeholder{
    aspect-ratio:16/9; background:var(--panel); border:1px solid rgba(59,42,32,0.18);
    display:flex; align-items:center; justify-content:center; margin:0 0 28px;
  }
  .map-placeholder span{ font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; }
  .location-panel p{ font-size:16px; color:var(--muted); }

  /* ---------- CONTACT ---------- */
  .contact-panel{ max-width:440px; margin:0 auto; text-align:center; }
  .contact-panel p{ color:var(--muted); margin:0 0 8px; font-size:15px; text-transform:uppercase; letter-spacing:0.06em; }
  .contact-panel .shortcut-btn{ display:inline-block; border:1px solid rgba(59,42,32,0.18); margin-top:4px; }

  /* ---------- ABOUT ---------- */
  .about-panel{ max-width:600px; margin:0 auto; text-align:center; }
  .about-panel p{ font-size:18px; color:var(--ink); }

  footer{
    padding:32px 0; display:flex; justify-content:center; align-items:center; gap:16px;
    font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em;
    border-top:1px solid rgba(59,42,32,0.18);
  }

  @media (max-width:860px){
    :root{ --header-h:72px; }
    main, body.fit-screen main{ padding-left:24px; padding-right:24px; }
    .header-side.right .nav-links{
      position:fixed; top:0; right:0; height:100vh; width:78%; max-width:320px; background:var(--paper);
      flex-direction:column; align-items:flex-start; justify-content:center; gap:28px; padding:40px 36px;
      transform:translateX(100%); transition:transform 0.3s ease; box-shadow:-8px 0 24px rgba(59,42,32,0.16);
    }
    .header-side.right .nav-links.open{ transform:translateX(0); }
    nav ul{ flex-direction:column; gap:22px; font-size:18px; }
    .menu-toggle{ display:block; }
    .shortcut-btn{ padding:clamp(14px, 2.4vh, 22px) 4px; font-size:12px; letter-spacing:0.02em; white-space:normal; }
    .stylist-grid{ grid-template-columns:1fr 1fr; }
    .services-index li{ grid-template-columns:1fr; }
    .service-note{ white-space:normal; }
    .stylist-block, .stylist-block.reverse{ flex-direction:column; text-align:center; gap:32px; padding:56px 0; }
    .stylist-bio{ text-align:center; }
    .stylist-bio-text{ margin:0 auto; }
    .stylist-photo-lg{ width:min(320px, 70vw); }
  }
  @media (max-width:520px){
    .stylist-grid{ grid-template-columns:1fr; }
  }
</style>
</head>
<body class="fit-screen">

<header id="siteHeader">
  <div class="header-side left">
    <a href="https://instagram.com/alexjdbeauty" aria-label="Instagram">Instagram</a>
  </div>
  <a class="header-wordmark" href="index.html">The Alexander Denaro Salon</a>
  <div class="header-side right">
    <button class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="navLinks">Menu</button>
    <div class="nav-links" id="navLinks">
      <nav><ul><li><a href="about.html">About</a></li><li><a href="contact.html">Contact</a></li></ul></nav>
    </div>
  </div>
</header>

<main>

  <section class="hero">
    <div class="hero-picture"><img src="Logo.jpeg.webp" alt="The Alexander Denaro Salon logo"></div>
    <p class="get-to-know">Get to know us</p>
    <div class="shortcuts">
      <a class="shortcut-btn" href="stylists.html">Stylists</a>
      <a class="shortcut-btn" href="services.html">Services</a>
      <a class="shortcut-btn" href="book.html">Book online</a>
      <a class="shortcut-btn" href="location.html">Location</a>
    </div>
  </section>

</main>

<footer>
  <span>The Alexander Denaro Salon — Long Island, NY</span>
</footer>

<script>
  const header = document.getElementById('siteHeader');
  const menuToggle = document.getElementById('menuToggle');
  const navLinks = document.getElementById('navLinks');
  menuToggle.addEventListener('click', () => {
    const isOpen = navLinks.classList.toggle('open');
    menuToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  });
  navLinks.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', () => {
      navLinks.classList.remove('open');
      menuToggle.setAttribute('aria-expanded', 'false');
    });
  });

  const revealEls = document.querySelectorAll('.reveal');
  if(revealEls.length){
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if(entry.isIntersecting){
          entry.target.classList.add('in-view');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.25 });
    revealEls.forEach(el => revealObserver.observe(el));
  }
</script>
</body>
</html>
