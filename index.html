<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home — The Alexander Denaro Salon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2E2013;
    --paper:#D4D5D8;
    --line:#2E2013;
    --muted:#6E543A;
    --panel:#DFE0E3;
    --hair:rgba(46,32,19,0.28);
    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --display: "Bebas Neue", "Oswald", Impact, "Arial Narrow", sans-serif;
    --header-h:96px;
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
  }
  @keyframes fadeDown{ from{ opacity:0; transform:translateY(-10px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(18px); } to{ opacity:1; transform:translateY(0); } }

  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--serif); font-size:20px; font-weight:400; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; text-decoration:none; }
  a:focus-visible, button:focus-visible{ outline:2px solid var(--ink); outline-offset:3px; }
  img{ display:block; max-width:100%; }
  main{ padding-top:var(--header-h); }

  /* ---------- HEADER ---------- */
  header{
    position:fixed; top:0; left:0; right:0; z-index:50; height:var(--header-h);
    padding:0 clamp(24px, 4.5vw, 88px);
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:24px;
    background:rgba(212,213,216,0.96);
    border-bottom:1px solid var(--line);
    animation:fadeDown 0.6s ease both;
  }
  .brand{ display:flex; flex-direction:column; line-height:1; justify-self:start; }
  .brand-main{
    font-family:var(--serif); font-weight:500; font-size:clamp(16px, 1.7vw, 26px);
    letter-spacing:0.1em; text-transform:uppercase; white-space:nowrap;
  }
  .nav-links ul{
    list-style:none; display:flex; gap:clamp(18px, 2.6vw, 40px); margin:0; padding:0;
    font-size:18px; letter-spacing:0.02em;
  }
  .nav-links a{ padding-bottom:2px; border-bottom:1px solid transparent; }
  .nav-links a:hover, .nav-links a.active{ border-bottom-color:var(--ink); }
  .header-right{ display:flex; align-items:center; gap:clamp(18px, 2.4vw, 40px); justify-self:end; }
  .header-phone{ font-size:20px; letter-spacing:0.02em; white-space:nowrap; }
  .btn{
    display:inline-block; padding:16px 34px; background:var(--ink); color:var(--paper);
    font-family:var(--serif); font-size:20px; font-weight:500; letter-spacing:0.02em; line-height:1.2;
    border:1px solid var(--ink); border-radius:0; cursor:pointer;
    transition:background 0.2s ease, color 0.2s ease;
  }
  .btn:hover{ background:transparent; color:var(--ink); }
  .btn-header{ padding:20px 32px; }
  .menu-toggle{
    display:none; background:none; border:none; cursor:pointer;
    font-family:var(--serif); font-size:16px; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--ink); padding:6px;
  }

  /* ---------- FOOTER ---------- */
  footer{
    padding:32px 0; display:flex; justify-content:center; align-items:center; gap:16px;
    font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em;
    border-top:1px solid var(--line);
  }

  @media (max-width:1100px){ .header-phone{ display:none; } }
  @media (max-width:860px){
    :root{ --header-h:72px; }
    header{ grid-template-columns:1fr auto; }
    .menu-toggle{ display:block; }
    .btn-header{ display:none; }
    .nav-links{
      position:fixed; top:0; right:0; height:100vh; width:78%; max-width:320px; background:var(--paper);
      display:flex; align-items:center; padding:40px 36px;
      transform:translateX(100%); transition:transform 0.3s ease, box-shadow 0.3s ease; box-shadow:none;
    }
    .nav-links.open{ transform:translateX(0); box-shadow:-8px 0 24px rgba(46,32,19,0.16); }
    .nav-links ul{ flex-direction:column; gap:22px; font-size:24px; }
  }

  main{ padding-top:var(--header-h); }

/* ---------- HERO: EDITORIAL LAYOUT ---------- */

/* ---------- COMPACT, OVERLAPPED HERO ---------- */
.hero {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(260px, 0.72fr);
  grid-template-rows: auto auto minmax(0, 1fr);
  grid-template-areas:
    "heading logo"
    "copy    logo"
    "photo   logo";
  column-gap: clamp(24px, 4vw, 64px);
  min-height: 0;
  height: calc(100svh - var(--header-h));
  padding: clamp(20px, 3vh, 36px) clamp(24px, 4.5vw, 88px);
  overflow: hidden;
}

.hero-heading {
  grid-area: heading;
  position: relative;
  z-index: 2;
}

.hero h1 {
  font-family: var(--display);
  font-weight: 400;
  text-transform: uppercase;
  font-size: clamp(56px, min(7vw, 12vh), 150px);
  line-height: 0.86;
  letter-spacing: 0.005em;
  margin: 0;
  animation: fadeUp 0.8s ease 0.25s both;
}

.hero-logo {
  grid-area: logo;
  width: 100%;
  max-height: 48vh;
  aspect-ratio: 4 / 3;
  align-self: start;
  overflow: hidden;
  background: var(--panel);
  animation: fadeUp 0.8s ease 0.1s both;
}

.hero-logo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.hero-copy {
  grid-area: copy;
  position: relative;
  z-index: 3;
  padding-top: clamp(12px, 2vh, 24px);
}

.hero-text {
  max-width: 42em;
  margin: 0 0 16px;
  font-size: clamp(17px, 1.35vw, 22px);
  line-height: 1.35;
  animation: fadeUp 0.8s ease 0.4s both;
}

.hero-copy .btn {
  padding: 12px 26px;
  animation: fadeUp 0.8s ease 0.5s both;
}

/* Photo is small and sits behind the copy */
.hero-photo {
  grid-area: photo;
  position: relative;
  z-index: 1;
  min-height: 0;
  height: 100%;
  margin-top: -18px;
  overflow: hidden;
  animation: fadeUp 0.8s ease 0.35s both;
}

.hero-photo img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: left bottom;
}

.hero-side {
  position: absolute;
  right: 10px;
  top: 50%;
  writing-mode: vertical-rl;
  transform: translateY(-50%) rotate(180deg);
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink);
}

/* Tablet */
@media (max-width: 860px) {
  .hero {
    height: calc(100svh - var(--header-h));
    grid-template-columns: minmax(0, 1fr) minmax(0, 0.75fr);
    grid-template-rows: auto auto minmax(0, 1fr);
    grid-template-areas:
      "heading logo"
      "copy    copy"
      "photo   photo";
    gap: 0 20px;
    padding: 24px;
  }

  .hero h1 {
    font-size: clamp(48px, 8vw, 82px);
  }

  .hero-logo {
    max-height: 30vh;
  }

  .hero-copy {
    padding-top: 20px;
  }

  .hero-photo {
    margin-top: -8px;
  }

  .hero-side {
    display: none;
  }
}

/* Mobile: compact vertical layout */
@media (max-width: 520px) {
  .hero {
    height: auto;
    min-height: 0;
    overflow: visible;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto auto auto;
    grid-template-areas:
      "heading"
      "logo"
      "copy"
      "photo";
    padding: 24px;
  }

  .hero h1 {
    font-size: clamp(54px, 13vw, 76px);
  }

  .hero-logo {
    width: min(72%, 260px);
    max-height: none;
    margin-top: 18px;
  }

  .hero-copy {
    padding-top: 18px;
  }

  .hero-text {
    font-size: 18px;
  }

  .hero-photo {
    height: 180px;
    margin-top: -12px;
  }

  .hero-photo img {
    object-position: left center;
  }
}
</style>
</head>
<body>

<header id="siteHeader">
  <a class="brand" href="index.html" aria-label="The Alexander Denaro Salon — home">
    <span class="brand-main">Alexander Denaro Salon</span>
  </a>

  <nav class="nav-links" id="navLinks" aria-label="Main">
    <ul><li><a href="stylists.html">Stylists</a></li><li><a href="services.html">Services</a></li><li><a href="about.html">About</a></li><li><a href="location.html">Location</a></li><li><a href="contact.html">Contact</a></li></ul>
  </nav>

  <div class="header-right">
    <a class="header-phone" href="tel:5166000072">516.600.0072</a>
    <a class="btn btn-header" href="book.html">Book Online</a>
    <button class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="navLinks">Menu</button>
  </div>
</header>

<main>

<section class="hero">
  <div class="hero-heading">
    <h1>Hair built<br>around you</h1>
  </div>

  <div class="hero-logo">
    <img src="Logo.jpeg.webp" alt="The Alexander Denaro Salon logo">
  </div>

  <div class="hero-copy">
    <p class="hero-text">
      Custom made extensions, color, cutting, and styling at our Long Island salon.
    </p>
    <a class="btn" href="book.html">Book Online</a>
  </div>

  <div class="hero-photo">
    <img src="alex.jpg" alt="Alexander Denaro consulting with a client">
  </div>

  <div class="hero-side">Long Island &bull; New York</div>
</section>
</main>

<footer>
  <span>The Alexander Denaro Salon — Long Island, NY</span>
</footer>

<script>
  const menuToggle = document.getElementById('menuToggle');
  const navLinks = document.getElementById('navLinks');
  menuToggle.addEventListener('click', () => {
    const isOpen = navLinks.classList.toggle('open');
    menuToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  });
  navLinks.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', () => {
      navLinks.classList.remove('open');
      menuToggle.setAttribute('aria-expanded', 'false');
    });
  });
  const revealEls = document.querySelectorAll('.reveal');
  if(revealEls.length){
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if(entry.isIntersecting){
          entry.target.classList.add('in-view');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.2 });
    revealEls.forEach(el => revealObserver.observe(el));
  }
</script>
</body>
</html>
